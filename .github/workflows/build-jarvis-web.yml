name: Build Jarvis Web

on:
  push:
    branches:
      - claude/jarvis-ai-backend-Iw0x3
      - codex/observer-current-state
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - '.github/workflows/build-jarvis-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm install

      - name: Verify observer state regressions
        run: node --test tests/*.test.mjs

      - name: Build
        run: npm run build
