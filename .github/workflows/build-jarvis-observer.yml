name: Build Jarvis Trading Observer

on:
  push:
    branches:
      - claude/jarvis-ai-backend-Iw0x3
      - codex/observer-current-state
    paths:
      - 'desktop/JarvisObserver/**'
      - 'desktop/JarvisObserver.CoreTests/**'
      - '.github/workflows/build-jarvis-observer.yml'
  pull_request:
    branches:
      - claude/jarvis-ai-backend-Iw0x3
    paths:
      - 'desktop/JarvisObserver/**'
      - 'desktop/JarvisObserver.CoreTests/**'
      - '.github/workflows/build-jarvis-observer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify order reader, phases, diagnostics, journal, outbox, frame store and command ledger
        run: dotnet run --project ./desktop/JarvisObserver.CoreTests/JarvisObserver.CoreTests.csproj -c Release

      - name: Publish single-file observer
        shell: pwsh
        run: >-
          dotnet publish .\desktop\JarvisObserver\JarvisObserver.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true

      - name: Create release bundle
        shell: pwsh
        run: |
          $publishRoot = '.\desktop\JarvisObserver\bin\Release'
          $exe = Get-ChildItem -Path $publishRoot -Filter 'JarvisObserver.exe' -Recurse |
            Where-Object { $_.FullName -like '*\win-x64\publish\JarvisObserver.exe' } |
            Select-Object -First 1
          if (-not $exe) { throw 'JarvisObserver.exe was not found in the publish output.' }
          New-Item -ItemType Directory -Force -Path '.\observer-release' | Out-Null
          Copy-Item $exe.FullName '.\observer-release\JarvisObserver.exe'
          Copy-Item '.\desktop\JarvisObserver\README.md' '.\observer-release\README.md'

      - name: Upload observer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisObserver-win-x64
          path: observer-release
          if-no-files-found: error
          retention-days: 30
